name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-suffix: docs
          cache-dependency-glob: docs/uv.lock

      # Installs ploneasgi[testing] from the checkout, Plone included: the API
      # pages import every module, and ploneasgi.testing imports Plone.
      - name: Install
        run: make install

      - name: Check for broken links
        run: make linkcheckbroken

      # -W turns every Sphinx warning into a failure; --keep-going reports all
      # of them in one run rather than stopping at the first.
      - name: Build HTML
        run: make build SPHINXOPTS="-W --keep-going"

      - name: Check style
        run: make vale VALEOPTS="--minAlertLevel='warning'"

      # Only main is published, so a pull request never uploads anything.
      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, and never cancel one halfway through.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
